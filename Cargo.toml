[package]
name = "rust-environment-api"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A reusable Rust API and CLI for inspecting the process and operating-system environment."
license = "MIT"
repository = "https://github.com/ArkansasIo/Rust-program"
readme = "README.md"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "rust-env"
path = "src/main.rs"
