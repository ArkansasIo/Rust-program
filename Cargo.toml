[package]
name = "rust-battle-engine"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
description = "Modular Rust combat and battle game engine for RPG and MMORPG projects."
license = "MIT"
repository = "https://github.com/ArkansasIo/Rust-program"
readme = "README.md"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "rust-battle"
path = "src/main.rs"
